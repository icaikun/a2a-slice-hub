  <text x="119.0" y="385" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="400" fill="#CBD5E1" text-anchor="middle">占用槽位</text>
  <rect x="212" y="338" width="130" height="64" rx="9" fill="#172554" stroke="#38BDF8" stroke-width="1.3"/>
  <text x="277.0" y="363" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="11.3" font-weight="700" fill="#F8FAFC" text-anchor="middle">working</text>
  <text x="277.0" y="385" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="400" fill="#CBD5E1" text-anchor="middle">无头 worktree</text>
  <rect x="370" y="338" width="166" height="64" rx="9" fill="#2E220B" stroke="#FBBF24" stroke-width="1.3"/>
