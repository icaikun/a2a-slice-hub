  <text x="300" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8" text-anchor="start">跨多轮提交持续存活 · 承载版本 CAS、依赖快照 integration_sha、重做预算与仲裁代次</text>
  <rect x="54" y="140" width="166" height="62" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="137.0" y="165" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">READY / WAITING</text>
  <text x="137.0" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#CBD5E1" text-anchor="middle">L0 审批 · 依赖就绪</text>
  <polyline points="223,171 242,171" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
