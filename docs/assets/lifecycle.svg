  <text x="940.0" y="315.96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#FDA4AF" text-anchor="middle">Circuit Breakers · 硬性熔断阈值</text>
  <text x="1062" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.2" font-weight="400" fill="#94A3B8" text-anchor="start">人工签名 resume 开启新仲裁代</text>
  <rect x="832" y="334" width="232" height="74" rx="10" fill="#110C18" stroke="#4C1D3D" stroke-width="1.2"/>
  <line x1="833" y1="344" x2="833" y2="398" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
  <text x="846" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" font-weight="700" fill="#F1F5F9" text-anchor="start">研发与协商上限</text>
  <circle cx="847" cy="372" r="2.2" fill="#FB7185"/>
  <text x="855" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.2" font-weight="400" fill="#CBD5E1" text-anchor="start">协商 / 打回满 3 轮 -&gt; BLOCKED</text>
  <circle cx="847" cy="391.5" r="2.2" fill="#FB7185"/>
  <text x="855" y="395.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.2" font-weight="400" fill="#CBD5E1" text-anchor="start">2 模块 × 2 人类申诉 -&gt; BLOCKED</text>
  <rect x="1076" y="334" width="232" height="74" rx="10" fill="#110C18" stroke="#1E3A5F" stroke-width="1.2"/>
  <line x1="1077" y1="344" x2="1077" y2="398" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <text x="1090" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" font-weight="700" fill="#F1F5F9" text-anchor="start">QA 环境与抖动隔离</text>
  <circle cx="1091" cy="372" r="2.2" fill="#38BDF8"/>
