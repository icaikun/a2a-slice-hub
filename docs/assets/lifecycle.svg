  <text x="713.0" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#CBD5E1" text-anchor="middle">PREPARED 冻结版本</text>
  <polyline points="799,171 818,171" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
