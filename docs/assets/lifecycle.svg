  <text x="316" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.3" font-weight="400" fill="#94A3B8" text-anchor="start">每次领单递增 lease_epoch · 终态不可变 · 杜绝旧僵尸进程覆写新提交</text>
  <rect x="54" y="338" width="130" height="64" rx="9" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.3"/>
