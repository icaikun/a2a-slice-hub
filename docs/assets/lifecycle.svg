  <text x="671.0" y="385" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="400" fill="#CBD5E1" text-anchor="middle">不可变终态 (永不复活)</text>
