  <text x="453.0" y="385" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.8" font-weight="400" fill="#CBD5E1" text-anchor="middle">释放槽位等契约</text>
  <rect x="564" y="338" width="214" height="64" rx="9" fill="#062E22" stroke="#34D399" stroke-width="1.3"/>
