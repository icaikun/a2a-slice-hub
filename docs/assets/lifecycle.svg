  <text x="921.0" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#CBD5E1" text-anchor="middle">Git CAS 已入分支</text>
  <polyline points="1023,171 1040,171" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
  <rect x="1044" y="140" width="256" height="62" rx="10" fill="#062E22" stroke="#34D399" stroke-width="1.4"/>
  <text x="1172.0" y="165" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">ACCEPTED / CLOSED</text>
  <text x="1172.0" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#CBD5E1" text-anchor="middle">独立 QA 签收终态</text>
  <polyline points="921,204 921,238 890,238" fill="none" stroke="#FB7185" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3"/>
  <rect x="346" y="226" width="540" height="24" rx="12.0" fill="#321325" stroke="#E11D48" stroke-width="1.0"/>
