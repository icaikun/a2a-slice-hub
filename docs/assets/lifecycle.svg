    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#FB7185"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1360" height="444" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  <rect x="0" y="0" width="1360" height="444" rx="20" fill="url(#dotGrid)"/>
  <text x="36" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19.5" font-weight="800" fill="#F8FAFC" text-anchor="start">Dual-State Lifecycle &amp; Four-Stage Decoupling · 双层状态机与四阶严格解耦</text>
  <text x="36" y="67" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" font-weight="400" fill="#94A3B8" text-anchor="start">为什么拆成两张状态表：A2A 协议中 Attempt 终态不可复活；门禁打回或 QA 抓虫只在 Work Item 上推进轮次并派发全新 Attempt</text>
  <rect x="36" y="88" width="1288" height="180" rx="14" fill="#0E192D" stroke="#3B82F6" stroke-width="1.4" filter="url(#cardShadow)"/>
  <rect x="52" y="102" width="232" height="24" rx="12.0" fill="#172554" stroke="#2563EB" stroke-width="1.0"/>
