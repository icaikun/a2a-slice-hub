  <polyline points="415,171 434,171" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
  <rect x="438" y="140" width="166" height="62" rx="10" fill="#2E220B" stroke="#FBBF24" stroke-width="1.4"/>
