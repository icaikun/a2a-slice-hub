  <text x="521.0" y="187" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#CBD5E1" text-anchor="middle">研发提交待过三关</text>
  <polyline points="607,171 626,171" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
  <rect x="630" y="140" width="166" height="62" rx="10" fill="#2A1B3D" stroke="#A78BFA" stroke-width="1.4"/>
