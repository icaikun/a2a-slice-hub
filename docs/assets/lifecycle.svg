  <circle cx="1091" cy="391.5" r="2.2" fill="#38BDF8"/>
  <text x="1099" y="395.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.2" font-weight="400" fill="#CBD5E1" text-anchor="start">FLAKY 复跑不一致 -&gt; 熔断不罚研发</text>
